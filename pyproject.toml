[project]
name = "vision-sandbox"
version = "1.0.0"
description = "Agentic Vision via Gemini's native Code Execution sandbox"
readme = "README.md"
authors = [{name = "Jo", email = "jo@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
]

[project.scripts]
vision-sandbox = "scripts.vision_executor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
